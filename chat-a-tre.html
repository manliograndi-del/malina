<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Chat — io, Lina e Claude</title>
<style>
  :root{
    color-scheme:light;   /* niente tema scuro: la chat resta chiara anche di notte */
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    /* carta calda e bordi tenui, come l'interfaccia di Claude */
    --bg:#faf9f5; --panel:#ffffff; --ink:#191917; --ink-soft:#6f6d66;
    --line:#e6e3d9; --mine:#1f6feb; --mine-ink:#ffffff;
    --claude-bg:#f2ede2; --claude-line:#ddd3bf; --danger:#a13d2d;
    --cuore:#d81414;
    /* Bolle semitrasparenti: il cuore si vede attraverso i messaggi.
       Il blu e' un po' piu' scuro dell'originale perche' con la
       trasparenza il testo bianco sopra resti leggibile. */
    --bolla:rgba(255,255,255,.66);
    --bolla-mia:rgba(17,78,184,.84);
    --bolla-claude:rgba(242,237,226,.66);
    --radius:18px;
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; line-height:1.45; display:flex; flex-direction:column;
  }
  #log{
    flex:1 1 auto; overflow-y:auto; padding:16px 12px 8px;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  }
  .empty{color:var(--ink-soft); font-size:14px; text-align:center; margin-top:32px; padding:0 24px}
  .row{
    display:flex; gap:8px; margin-bottom:14px; align-items:flex-end;
    /* le righe fuori dallo schermo non vengono disegnate finche' non servono:
       con una conversazione lunga e' la differenza fra scorrere e arrancare */
    content-visibility:auto; contain-intrinsic-size:auto 62px;
  }
  .row.me{flex-direction:row-reverse}
  .av{width:28px;height:28px;border-radius:50%;flex:0 0 auto;object-fit:cover;background:var(--line)}
  .av.cl{display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--claude-bg);border:1px solid var(--claude-line)}
  .bubble{
    max-width:min(78%,560px); padding:9px 13px; border-radius:var(--radius);
    background:var(--bolla); border:1px solid var(--line); overflow-wrap:anywhere;
  }
  .row.me .bubble{background:var(--bolla-mia); color:var(--mine-ink); border-color:transparent}
  .row.claude .bubble{background:var(--bolla-claude); border-color:var(--claude-line)}
  .name{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:2px; font-weight:600}
  .row.me .name{display:none}
  .txt{white-space:pre-wrap}
  .time{display:block; font-size:11px; opacity:.6; margin-top:3px}
  .row.me .time{opacity:.85}
  .thinking{font-style:italic; color:var(--ink-soft)}
  footer{
    flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  }
  .bar{display:flex; gap:8px; align-items:flex-end}
  .bar button{flex:0 0 auto}
  textarea{
    flex:1 1 auto; min-width:0; resize:none; font:inherit; color:inherit; background:var(--bg);
    border:1px solid var(--line); border-radius:12px; padding:9px 11px; max-height:120px; min-height:42px;
  }
  textarea:focus{outline:2px solid var(--mine); outline-offset:-1px}
  button{
    font:inherit; border-radius:12px; border:1px solid var(--line); background:var(--bg);
    color:var(--ink); padding:9px 13px; min-height:42px; cursor:pointer;
  }
  button.primary{background:var(--mine); color:var(--mine-ink); border-color:transparent; font-weight:600}
  button:disabled{opacity:.45; cursor:default}
  .sotto{display:flex; align-items:center; gap:8px; margin:7px 2px 0}
  .hint{font-size:12px; color:var(--ink-soft); margin:0; flex:1 1 auto}
  .hint b{font-weight:600; color:var(--ink)}
  .err{color:var(--danger)}
  /* Avvisi e rifiuti stanno in fondo, sopra ai pulsanti: e' li' che si
     guarda quando si preme, e in cima allo schermo non si vedevano. */
  .banner{
    margin:0 0 8px; padding:10px 12px; border:1px solid var(--line);
    border-radius:12px; background:var(--bg); font-size:14px; color:var(--ink-soft);
  }

  /* Le tre scorciatoie per chiedere un parere a Claude: una riga sola,
     ben visibili, ognuna larga quanto le serve. */
  .scorciatoie{display:flex; gap:6px; flex-wrap:nowrap; margin:0 0 8px}
  .chip{
    font:inherit; font-size:14px; font-weight:600; line-height:1.2;
    padding:10px 8px; min-height:40px; flex:1 1 auto; min-width:0;
    white-space:nowrap; text-align:center;
    border:1px solid var(--claude-line); background:var(--claude-bg);
    color:var(--ink); border-radius:12px; cursor:pointer;
  }
  .chip:disabled{opacity:.4; cursor:default}
  /* sui telefoni piu' stretti le tre scritte non ci stanno a questa misura */
  @media (max-width: 365px){
    .chip{font-size:13px; padding:10px 5px}
  }
  /* il tasto che scrive @claude nel messaggio: con la scritta, non con un simbolo */
  #mention{font-size:13px; font-weight:600; padding:9px 10px; color:var(--ink-soft)}
  /* tasto per spegnere il suono del battito: piccolo, in fondo a destra */
  #suono{
    border:none; background:none; padding:0 2px; min-height:0;
    font-size:15px; line-height:1; opacity:.7; flex:0 0 auto;
  }

  /* chiede il nome a chi la piattaforma non riconosce (invitata da fuori) */
  .velo{
    position:fixed; inset:0; z-index:3; display:flex; align-items:center;
    justify-content:center; padding:24px; background:rgba(30,28,26,.45);
  }
  .velo[hidden]{display:none}
  .scelta{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:20px; max-width:340px; width:100%;
  }
  .scelta h2{margin:0 0 8px; font-size:17px}
  .scelta p{margin:0 0 14px; font-size:14px; color:var(--ink-soft)}
  .scelta input{
    font:inherit; width:100%; padding:10px 12px; margin-bottom:12px;
    border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink);
  }
  .scelta button{width:100%}
  /* pallino con l'iniziale, per chi non ha una foto del profilo */
  .av.ini{
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:600; background:#f7d7d4; color:#8d3a34;
  }

  /* riga sotto al nome di Claude: da chi risulta la richiesta */
  .perconto{font-weight:400; color:var(--ink-soft)}

  /* ---------- cuore di sfondo ---------- */
  /* Sta dietro a tutto e non intercetta tocchi: e' solo decorazione. */
  #cuore{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    /* Lo teniamo su un livello grafico suo: senza questo il telefono
       ridisegna tutto il cuore a ogni frame mentre si scorre, e lo
       scorrimento diventa legnoso. */
    transform:translateZ(0); will-change:transform; contain:paint;
  }
  #cuore .grande{width:min(92vw,440px); height:auto; opacity:.6; overflow:visible}
  /* i cuoricini stanno dietro al cuore grande, molto piu' chiari */
  #cuore .filigrana{position:absolute; inset:0; width:100%; height:100%}
  .cuoricini use{fill:none; stroke:var(--cuore); stroke-width:1.6; opacity:.1}
  #gruppo{transform-origin:50px 48px}
  .meta{
    fill:var(--cuore); transform-origin:50px 48px;
    transition:transform .55s cubic-bezier(.22,.9,.3,1);
  }
  /* a riposo: spezzato, le due meta' scostate e inclinate */
  .sx{transform:translate(-9px,3px) rotate(-9deg)}
  .dx{transform:translate(9px,3px) rotate(9deg)}
  /* quando arriva un messaggio: si ricompone e batte */
  #cuore.unito .meta{transform:none}
  #cuore.unito #gruppo{animation:batti 2s ease-in-out .5s}
  @keyframes batti{
    0%,100%{transform:scale(1)}
    6%,31%,56%,81%{transform:scale(1.1)}
    15%,40%,65%,90%{transform:scale(1)}
  }
  /* chi ha chiesto meno animazioni al telefono vede il cuore fermo */
  @media (prefers-reduced-motion: reduce){
    .meta{transition:none}
    #cuore.unito #gruppo{animation:none}
  }
  /* la chat sta sopra al cuore */
  #banner,#log,footer{position:relative; z-index:1}
</style>
</head>
<body>

      <!-- le due meta' condividono la stessa linea di frattura, cosi' combaciano -->
      <path class="meta sx" d="M50 20 C46 9 37 2 27 2 C7 2 -5 26 10 45 L50 88 L44 70 L55 57 L43 43 L53 30 Z"/>
      <path class="meta dx" d="M50 20 C54 9 63 2 73 2 C93 2 105 26 90 45 L50 88 L44 70 L55 57 L43 43 L53 30 Z"/>

</div>

<div id="nomeOspite" class="velo" hidden>
  <div class="scelta">
    <h2>Come ti chiami?</h2>
    <p>Questa chat non riesce a leggere il tuo nome dal tuo account, perch&eacute; sei
       stata invitata da fuori. Scrivilo tu: comparir&agrave; sopra ai tuoi messaggi.</p>
    <input id="campoNome" type="text" maxlength="24" placeholder="Il tuo nome">
    <button id="confermaNome" class="primary" type="button">Entra nella chat</button>
  </div>
</div>

<div id="log"><p class="empty" id="empty">Caricamento…</p></div>

<footer>
  <div id="banner" class="banner" hidden></div>
  <div class="scorciatoie">
    <button class="chip" id="chip-ultimo" type="button" disabled>Ultimo</button>
    <button class="chip" id="chip-scambi" type="button" disabled>Ultimi tre scambi</button>
    <button class="chip" id="chip-tutto" type="button" disabled>Conversazione</button>
  </div>
  <div class="bar">
    <button id="mention" type="button" title="Scrive @claude all'inizio del messaggio">@claude</button>
    <textarea id="input" rows="1" placeholder="Scrivi un messaggio…" disabled></textarea>
    <button id="send" class="primary" type="button" disabled>Invia</button>
  </div>
  <div class="sotto">
    <p class="hint" id="hint"></p>
    <button id="suono" type="button" title="Suono del battito">&#128266;</button>
  </div>
</footer>

<script>
(function(){
  "use strict";

  var S = {
    db:null, user:null, sample:null,
    uid:null, myName:"", mioNome:"", ospite:false,
    proprietario:null,     // id di chi possiede la chat: a lui risultano le richieste a Claude
    remote:new Map(),      // docId -> {day, authorId, items}
    pending:[],            // miei item non ancora confermati dallo snapshot
    profiles:{},
    streaming:null,        // {text}
    busy:false,
    queue:Promise.resolve(),
    primoCaricamento:true,  // la cronologia iniziale non fa battere il cuore
    visti:Object.create(null)
  };

  var log=document.getElementById("log"), empty=document.getElementById("empty"),
      input=document.getElementById("input"), send=document.getElementById("send"),
      mention=document.getElementById("mention"), hint=document.getElementById("hint"),
      banner=document.getElementById("banner"),
      cuore=document.getElementById("cuore"),
      tastoSuono=document.getElementById("suono"),
      chipUltimo=document.getElementById("chip-ultimo"),
      chipScambi=document.getElementById("chip-scambi"),
      chipTutto=document.getElementById("chip-tutto"),
      veloNome=document.getElementById("nomeOspite"),
      campoNome=document.getElementById("campoNome"),
      confermaNome=document.getElementById("confermaNome");

  function today(){ return new Date().toISOString().slice(0,10); }
  function uid(){ return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8); }
  function hhmm(ts){ var d=new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  function esc(t){ var n=document.createElement("div"); n.textContent=t; return n; }
  function showBanner(msg, bad){ banner.hidden=false; banner.textContent=msg; banner.classList.toggle("err", !!bad); }
  function puliscBanner(){ banner.hidden=true; banner.textContent=""; }

  // Una sola riga sotto la casella, corta. Chi si e' scritto il nome da solo
  // lo vede li' e lo puo' cambiare: e' l'unico posto rimasto, ora che
  // l'intestazione non c'e' piu'.
  function aggiornaRigaSotto(){
    hint.textContent="";
    if(!S.sample){
      hint.textContent = "Claude non è disponibile in questa vista: la chat resta a due.";
      return;
    }
    if(S.ospite && S.mioNome){
      var b=document.createElement("b");
      b.textContent=S.mioNome;
      b.style.cursor="pointer";
      b.addEventListener("click", chiediNome);
      hint.appendChild(document.createTextNode("Sei "));
      hint.appendChild(b);
      hint.appendChild(document.createTextNode(" · scrivi @claude per chiamarlo"));
    } else {
      hint.appendChild(document.createTextNode("Scrivi "));
      var c=document.createElement("b"); c.textContent="@claude";
      hint.appendChild(c);
      hint.appendChild(document.createTextNode(" nel messaggio per farlo intervenire"));
    }
  }

  // ---------- identita' di chi e' invitato da fuori ----------
  // La piattaforma da' un id solo alle persone dell'organizzazione del
  // proprietario. Chi e' invitato via email da fuori PUO' SCRIVERE ma non ha
  // id e non ha nome: senza un ripiego la pagina la bloccherebbe, ed e'
  // esattamente il difetto che aveva. Quindi le diamo un'identita' locale,
  // che resta su quel telefono, e il nome se lo scrive lei.
  function idOspite(){
    var v=null;
    try{ v=localStorage.getItem("ospiteId"); }catch(e){}
    if(!v){
      v = "ospite-" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      try{ localStorage.setItem("ospiteId", v); }catch(e){}
    }
    return v;
  }
  function nomeOspite(){
    try{ return localStorage.getItem("ospiteNome")||""; }catch(e){ return ""; }
  }
  function salvaNomeOspite(n){
    S.mioNome=n;
    try{ localStorage.setItem("ospiteNome", n); }catch(e){}
  }
  function chiediNome(){
    veloNome.hidden=false;
    campoNome.value=S.mioNome||"";
    setTimeout(function(){ campoNome.focus(); }, 50);
  }
  confermaNome.addEventListener("click", function(){
    var n=(campoNome.value||"").trim();
    if(!n) { campoNome.focus(); return; }
    salvaNomeOspite(n);
    veloNome.hidden=true;
    aggiornaRigaSotto();
    render();
    input.focus();
  });
  campoNome.addEventListener("keydown", function(e){
    if(e.key==="Enter"){ e.preventDefault(); confermaNome.click(); }
  });

  // ---------- chi possiede la chat ----------
  // Le richieste a Claude risultano sempre inviate da chi possiede la chat,
  // anche quando e' l'altra persona a premere il pulsante: e' una scelta
  // dell'utente. Serve saperne l'id da qualunque telefono, quindi il
  // proprietario lo scrive una volta sola nell'archivio.
  function nomeProprietario(){
    if(!S.proprietario) return "";
    return (S.profiles[S.proprietario]||{}).name || "";
  }

  // ---------- suono del battito ----------
  // Il suono e' generato dalla pagina (niente file da scaricare, che il
  // progetto vieta): un tonfo grave piu' un fruscio filtrato, come il
  // battito che si sente da un'ecografia.
  // ISTANTI DEI BATTITI, in secondi dall'inizio dell'animazione. Devono
  // restare uguali ai picchi dei keyframes "batti" nel CSS (6%, 31%, 56%,
  // 81% di 2s, piu' mezzo secondo di attesa perche' le meta' si riuniscano).
  var BATTITI = [0.62, 1.12, 1.62, 2.12];
  var audio=null, rumore=null, uscita=null, suonoAcceso=true;

  try{ suonoAcceso = localStorage.getItem("battito") !== "muto"; }catch(e){}

  // L'audio puo' partire solo dopo che la persona ha toccato la pagina
  // (lo impongono i browser): lo preparo al primo tocco, qualunque esso sia.
  function preparaAudio(){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{
      if(!audio){
        audio = new AC();
        var n = Math.floor(audio.sampleRate*0.6);
        rumore = audio.createBuffer(1, n, audio.sampleRate);
        var d = rumore.getChannelData(0), scorso=0;
        for(var i=0;i<n;i++){ var bianco=Math.random()*2-1; scorso=(scorso+0.02*bianco)/1.02; d[i]=scorso*3.2; }
        // Uscita comune: un compressore tiene il battito forte senza farlo
        // gracchiare quando i due tempi si sovrappongono.
        uscita = audio.createGain();
        uscita.gain.value = 1;
        var comp = audio.createDynamicsCompressor();
        comp.threshold.setValueAtTime(-14, audio.currentTime);
        comp.ratio.setValueAtTime(6, audio.currentTime);
        uscita.connect(comp); comp.connect(audio.destination);
      }
      if(audio.state==="suspended") audio.resume();
    }catch(e){ audio=null; }
  }

  // COME E' FATTO IL BATTITO
  // Scelto all'ascolto fra tre versioni: questa e' la piu' ovattata, quella
  // che somiglia al battito sentito attraverso il liquido, in ecografia.
  // Niente colpo secco e niente toni: solo rumore sordo, rallentato e
  // tagliato in basso, con la forma di un battito. Tutto quello che sta
  // sopra i 300 Hz e' sibilo, ed e' il sibilo a far sembrare il suono una
  // macchina: per questo il filtro taglia cosi' in basso.
  function tonfo(quando, forza, primo){
    if(!audio || !uscita) return;
    try{
      var fl=audio.createBufferSource(), lp=audio.createBiquadFilter(), gf=audio.createGain();
      fl.buffer=rumore;
      // rallentato, e mai due volte uguale
      fl.playbackRate.value = (primo?0.5:0.42) * (0.92+Math.random()*0.16);
      lp.type="lowpass"; lp.Q.value=1.4;
      lp.frequency.setValueAtTime((primo?285:235) * (0.94+Math.random()*0.12), quando);
      // e mentre il battito si spegne il suono si fa piu' cupo, come
      // qualcosa che si allontana nell'acqua
      lp.frequency.exponentialRampToValueAtTime(primo?150:130, quando+0.26);
      gf.gain.setValueAtTime(0.0001, quando);
      gf.gain.exponentialRampToValueAtTime(forza, quando+0.045);
      gf.gain.exponentialRampToValueAtTime(0.0001, quando+(primo?0.3:0.24));
      fl.connect(lp); lp.connect(gf); gf.connect(uscita);
      fl.start(quando, Math.random()*0.3); fl.stop(quando+0.34);
    }catch(e){}
  }





  // Quattro battiti, ognuno in due tempi (il "tu-tum"), agganciati ai
  // momenti in cui il disegno si gonfia.
  function programmaBattiti(){
    var ora=audio.currentTime;
    BATTITI.forEach(function(t){
      // Un cuore non e' un metronomo: ogni battito cade un istante prima o
      // dopo e con un filo di forza diversa. Sono scarti impercettibili
      // all'occhio ma sono quelli che lo fanno sentire vivo.
      var scarto = (Math.random()-0.5)*0.014;
      var intensita = 1 + (Math.random()-0.5)*0.14;
      // Livello scelto misurando piu' volte: il picco resta sotto il limite
      // e nessun campione viene tagliato. I numeri dipendono da come e'
      // costruito il suono: non vanno confrontati con quelli delle versioni
      // precedenti.
      tonfo(ora+t+scarto, 2.0*intensita, true);
      tonfo(ora+t+0.16+scarto+Math.random()*0.012, 1.4*intensita, false);
    });
  }

  function suonaBattito(){
    if(!suonoAcceso) return;
    preparaAudio();
    if(!audio) return;
    if(audio.state==="running"){ programmaBattiti(); return; }
    // Il telefono tiene l'audio sospeso finche' non riconosce un tocco:
    // provo a svegliarlo e parto appena ci riesce.
    try{
      audio.resume().then(function(){
        if(audio.state==="running") programmaBattiti();
      }, function(){});
    }catch(e){}
  }

  function aggiornaTastoSuono(){
    tastoSuono.textContent = suonoAcceso ? "\uD83D\uDD0A" : "\uD83D\uDD07";
    tastoSuono.setAttribute("aria-label", suonoAcceso ? "Battito con suono" : "Battito silenzioso");
  }
  tastoSuono.addEventListener("click", function(){
    suonoAcceso = !suonoAcceso;
    try{ localStorage.setItem("battito", suonoAcceso ? "acceso" : "muto"); }catch(e){}
    aggiornaTastoSuono();
    if(!suonoAcceso) return;
    // Accendendo il suono si sente subito un battito di prova: cosi' si
    // capisce se il telefono lo lascia passare.
    preparaAudio();
    suonaBattito();
    setTimeout(function(){
      if(!audio){
        showBanner("Questo browser non sa riprodurre il battito.", true);
      } else if(audio.state!=="running"){
        showBanner("Il telefono sta tenendo l'audio spento. Controlla il tasto del silenzioso (sull'iPhone la levetta laterale) e alza il volume, poi riprova.", true);
      } else {
        banner.hidden=true;
      }
    }, 600);
  });
  aggiornaTastoSuono();
  document.addEventListener("pointerdown", preparaAudio, {once:true});

  // ---------- cuore ----------
  // Le due meta' si ricongiungono e battono quattro volte, poi tornano
  // separate. Solo decorazione: se qualcosa qui non va, la chat funziona.
  var cuoreTimer=null;
  function animaCuore(conSuono){
    if(!cuore) return;
    clearTimeout(cuoreTimer);
    cuore.classList.remove("unito");
    void cuore.offsetWidth;          // fa ripartire l'animazione da capo
    cuore.classList.add("unito");
    if(conSuono) suonaBattito();
    cuoreTimer=setTimeout(function(){ cuore.classList.remove("unito"); }, 2700);
  }

  // Batte solo per i messaggi scritti dalle persone e appena arrivati: non
  // per la cronologia che si carica all'apertura, ne' per le risposte di Claude.
  function controllaNuovi(items){
    var batti=false, conSuono=false, adesso=Date.now();
    items.forEach(function(it){
      if(S.visti[it.id]) return;
      S.visti[it.id]=1;
      // Il cuore batte solo per i messaggi che le due persone si mandano
      // fra loro. Quelli rivolti a Claude lo lasciano fermo e spezzato: il
      // cuore e' loro, non della conversazione con lui.
      if(!S.primoCaricamento && it.kind==="human" && adesso-(it.ts||0) < 120000
         && !wantsClaude(it.text||"")){
        batti=true; conSuono=true;
      }
    });
    if(batti) animaCuore(conSuono);
  }

  // ---------- raccolta e ordinamento ----------
  function allItems(){
    var out=[], seen=Object.create(null);
    S.remote.forEach(function(doc){
      (doc.items||[]).forEach(function(it){
        if(it && it.id && !seen[it.id]){ seen[it.id]=1; out.push(it); }
      });
    });
    S.pending.forEach(function(it){ if(!seen[it.id]){ seen[it.id]=1; out.push(it); } });
    out.sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
    return out;
  }

  // ---------- render ----------
  var renderToken=0, ultimaFirma=null, nodoStreaming=null;
  function render(){
    var items=allItems(), token=++renderToken;
    controllaNuovi(items);
    var ids=[]; items.forEach(function(it){
      if(!it.nome && it.authorId && ids.indexOf(it.authorId)<0) ids.push(it.authorId);
    });
    if(S.proprietario && ids.indexOf(S.proprietario)<0) ids.push(S.proprietario);

    var draw=function(){
      if(token!==renderToken) return;
      // Se non e' cambiato niente non si ridisegna: rifare l'elenco mentre
      // qualcuno sta scorrendo col dito e' proprio cio' che lo fa inceppare.
      var firma = items.map(function(it){
        return it.id+":"+((S.profiles[it.authorId]||{}).name||"");
      }).join("|")+"#"+(S.streaming ? S.streaming.text.length : "-")+"#"+(nomeProprietario()||"");
      if(firma===ultimaFirma && log.firstChild) return;
      ultimaFirma=firma;

      var atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
      log.textContent="";
      if(!items.length && !S.streaming){
        var p=document.createElement("p"); p.className="empty";
        p.textContent="Nessun messaggio. Scrivi qualcosa: la conversazione resta qui.";
        log.appendChild(p);
      }
      items.forEach(function(it){ log.appendChild(bubble(it)); });
      if(S.streaming){
        nodoStreaming = bubble({kind:"claude", text:S.streaming.text||"", ts:Date.now(), live:true});
        log.appendChild(nodoStreaming);
      } else nodoStreaming=null;
      // Si segue la conversazione solo se si era gia' in fondo: prima, mentre
      // Claude rispondeva, ogni pezzo di risposta ti riportava in fondo a
      // forza e non si riusciva piu' a leggere indietro.
      if(atBottom) log.scrollTop = log.scrollHeight;
    };

    if(ids.length && S.user && S.user.profiles){
      S.user.profiles(ids).then(function(ps){ S.profiles=ps||{}; draw(); });
    } else draw();
  }

  function bubble(it){
    var isClaude = it.kind==="claude";
    var mine = !isClaude && it.authorId===S.uid;
    var row=document.createElement("div");
    row.className="row"+(mine?" me":"")+(isClaude?" claude":"");

    if(isClaude){
      var mark=document.createElement("div"); mark.className="av cl"; mark.textContent="✦"; row.appendChild(mark);
    } else if(it.nome || !(S.profiles[it.authorId]||{}).avatarUrl){
      var cer=document.createElement("div"); cer.className="av ini";
      var n0 = it.nome || (S.profiles[it.authorId]||{}).name || "?";
      cer.textContent=n0.slice(0,1).toUpperCase();
      row.appendChild(cer);
    } else {
      var img=document.createElement("img"); img.className="av"; img.alt="";
      img.src=S.profiles[it.authorId].avatarUrl;
      row.appendChild(img);
    }

    var b=document.createElement("div"); b.className="bubble";
    var nm=document.createElement("span"); nm.className="name";
    nm.textContent = isClaude ? "Claude" : (it.nome || (S.profiles[it.authorId]||{}).name || "Qualcuno");
    // Sotto al nome di Claude si legge da chi risulta la richiesta: e' sempre
    // chi possiede la chat, anche quando il pulsante l'ha premuto l'altra persona.
    if(isClaude && nomeProprietario()){
      var pc=document.createElement("span");
      pc.className="perconto";
      pc.textContent=" \u00b7 su richiesta di "+nomeProprietario();
      nm.appendChild(pc);
    }
    b.appendChild(nm);

    var tx=document.createElement("div"); tx.className="txt";
    if(it.live && !it.text){ tx.className="txt thinking"; tx.textContent="Sto pensando…"; }
    else tx.textContent=it.text||"";
    b.appendChild(tx);

    if(!it.live){ var t=document.createElement("span"); t.className="time"; t.textContent=hhmm(it.ts); b.appendChild(t); }
    row.appendChild(b);
    return row;
  }

  // ---------- scrittura (una alla volta, solo sul mio documento) ----------
  // Se una scrittura non risponde piu', dopo venti secondi si prosegue lo
  // stesso: il messaggio resta fra quelli da confermare e viene risalvato
  // col messaggio successivo. Senza questo, una scrittura appesa bloccherebbe
  // per sempre tutte quelle dopo.
  function conTempoMassimo(promessa, ms){
    return Promise.race([promessa, new Promise(function(r){ setTimeout(r, ms); })]);
  }

  function persist(item){
    S.pending.push(item);
    render();
    S.queue = S.queue.then(function(){
      if(!S.db || !S.uid) return;
      var id = today()+"__"+S.uid;
      var doc = S.remote.get(id);
      var base = doc && doc.items ? doc.items.slice() : [];
      var seen=Object.create(null); base.forEach(function(x){ seen[x.id]=1; });
      S.pending.forEach(function(x){ if(!seen[x.id]){ seen[x.id]=1; base.push(x); } });
      base.sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
      return conTempoMassimo(S.db.doc("messages/"+id).set({day:today(), authorId:S.uid, items:base}), 20000);
    }).catch(function(e){
      showBanner(e && e.code==="invalid_argument"
        ? "Non hai il permesso di scrivere in questa chat: chiedi l'accesso «può interagire»."
        : "Un messaggio non è stato salvato. Riprova.", true);
    });
    return S.queue;
  }

  // ---------- Claude ----------
  function wantsClaude(t){ return /(^|\s|@)@claude\b/i.test(t) || /@claude/i.test(t); }

  // Quanta conversazione passiamo a Claude: al massimo questi messaggi e questi
  // caratteri, presi dalla fine (i piu' recenti). Il tetto in caratteri serve
  // perche' pochi messaggi lunghissimi pesano piu' di tanti messaggi brevi.
  var MEMORIA_MSG = 60, MEMORIA_CARATTERI = 12000;

  function ultimi(items){ return items.slice(-MEMORIA_MSG); }

  function transcript(items){
    var righe = items.map(function(it){
      var nm = it.kind==="claude" ? "Claude" : (it.nome || (S.profiles[it.authorId]||{}).name || "Partecipante");
      var d = new Date(it.ts);
      var giorno = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      return "["+giorno+" "+hhmm(it.ts)+"] "+nm+": "+(it.text||"");
    });
    // Riempio partendo dal fondo finche' sto nel tetto: l'ultimo messaggio
    // (quello che ha chiamato Claude) c'e' sempre, anche se e' lunghissimo.
    var out=[], tot=0;
    for(var i=righe.length-1; i>=0; i--){
      tot += righe[i].length+1;
      if(tot>MEMORIA_CARATTERI && out.length) break;
      out.unshift(righe[i]);
    }
    return out.join("\n");
  }

  // Una sola strada per interpellare Claude: cambia solo il compito che gli
  // si affida e la fetta di conversazione che gli si mette sotto gli occhi.
  // "compito" puo' essere una funzione, cosi' la frase si compone quando i
  // nomi delle persone sono gia' stati risolti.
  var attesaMassima=null;
  function chiediAClaude(items, compito){
    if(!S.sample || !items.length) return;
    if(S.busy){ showBanner("Claude sta gia' rispondendo: aspetta un momento.", false); return; }
    S.busy=true; abilitaComandi(false);
    S.streaming={text:""}; render();

    // Se la risposta non arriva mai (consenso rimasto in sospeso, rete che
    // cade), dopo un minuto e mezzo la pagina si riprende da sola.
    clearTimeout(attesaMassima);
    attesaMassima=setTimeout(function(){
      if(!S.busy) return;
      S.busy=false; S.streaming=null; abilitaComandi(true);
      showBanner("Claude non ha risposto in tempo. Puoi riprovare.", true);
      render();
    }, 90000);

    // Prima di scrivere il prompt risolvo i nomi di chi compare nella
    // trascrizione: senza questo passaggio, alla prima chiamata della sessione
    // Claude leggerebbe "Partecipante" per tutti e non distinguerebbe chi parla.
    var ids=[];
    items.forEach(function(it){
      if(!it.nome && it.authorId && ids.indexOf(it.authorId)<0) ids.push(it.authorId);
    });
    if(S.proprietario && ids.indexOf(S.proprietario)<0) ids.push(S.proprietario);
    var nomiPronti = (ids.length && S.user && S.user.profiles)
      ? Promise.resolve(S.user.profiles(ids)).then(function(ps){ if(ps) S.profiles=ps; }, function(){})
      : Promise.resolve();

    nomiPronti.then(function(){
      // Chi ha materialmente premuto il pulsante non conta: la richiesta
      // risulta sempre di chi possiede la chat, ed e' a lui che Claude parla.
      var perConto = nomeProprietario()
        ? "Chi ti chiede di intervenire e' sempre "+nomeProprietario()+", "+
          "anche quando a premere il pulsante e' stata l'altra persona: "+
          "e' la sua curiosita'. Rivolgi la risposta a lui.\n"
        : "";

      var prompt =
        "Sei il terzo partecipante di una chat privata fra due persone.\n"+
        "Qui sotto c'e' la conversazione recente, in ordine di tempo, con data e ora di ogni messaggio.\n"+
        "Oggi e' "+today()+". La conversazione puo' essere iniziata giorni fa: tienine conto.\n"+
        perConto+
        (typeof compito==="function" ? compito() : compito)+"\n\n"+
        "--- TRASCRIZIONE ---\n"+transcript(items)+"\n--- FINE ---\n\n"+
        "Rispondi in italiano, dando del tu, come un terzo partecipante: breve (2-6 frasi), "+
        "al punto, senza preamboli, senza ripetere la domanda e senza firmarti. "+
        "Parla alle persone per nome quando serve distinguerle. "+
        "Se ti mancano informazioni per rispondere bene, dillo e chiedi il dato che manca.";

      return S.sample(prompt, {
        onText: function(ev){
          if(!S.streaming) return;
          S.streaming.text = ev.text;
          // Rifare l'elenco intero a ogni parola che arriva inchioda la
          // pagina: si riscrive solo la bolla che sta crescendo.
          var tx = nodoStreaming && nodoStreaming.querySelector(".txt");
          if(tx){
            tx.className="txt";
            tx.textContent=ev.text;
            if(log.scrollHeight - log.scrollTop - log.clientHeight < 80) log.scrollTop=log.scrollHeight;
          } else render();
        }
      });
    }).then(function(res){
      S.streaming=null;
      persist({id:uid(), ts:Date.now(), kind:"claude", authorId:S.uid, text:(res.text||"").trim()});
    }).catch(function(e){
      var keep = e && e.text ? e.text.trim() : "";
      S.streaming=null;
      if(keep) persist({id:uid(), ts:Date.now(), kind:"claude", authorId:S.uid, text:keep+"\n\n[risposta interrotta]"});
      var m = {
        not_granted:"Hai rifiutato l'uso di Claude in questa pagina. Ricarica per riprovare.",
        rate_limited:"Troppe richieste ravvicinate: aspetta un momento.",
        cancelled:""
      }[e && e.code] || "Claude non e' riuscito a rispondere.";
      if(m) showBanner(m, true);
      render();
    }).then(function(){
      clearTimeout(attesaMassima);
      S.busy=false; abilitaComandi(true); input.focus();
    });
  }

  // Mentre Claude sta rispondendo restano spenti solo i pulsanti che
  // farebbero partire una seconda domanda: scrivere e inviare un messaggio
  // dev'essere sempre possibile, anche durante l'attesa (che puo' durare
  // un minuto). Spegnere "Invia" faceva sembrare la pagina bloccata.
  function abilitaComandi(si){
    chipUltimo.disabled = !si || !S.sample;
    chipScambi.disabled = !si || !S.sample;
    chipTutto.disabled  = !si || !S.sample;
  }

  // Chiamata scrivendo @claude dentro un messaggio.
  function askClaude(){
    chiediAClaude(ultimi(allItems()),
      "L'ultimo messaggio ti ha chiamato con @claude: rispondi a quello, "+
      "ma tenendo presente tutto quello che le due persone si sono dette prima.");
  }

  // ---------- scambi ----------
  // Uno "scambio" e' tutto quello che una persona scrive di fila prima che
  // l'altra risponda: tre messaggi di seguito della stessa persona valgono
  // un solo scambio. Le risposte di Claude non contano come scambio.
  function scambi(items){
    var out=[];
    items.forEach(function(it){
      if(it.kind!=="human") return;
      var ultimo=out[out.length-1];
      if(ultimo && ultimo.authorId===it.authorId) ultimo.items.push(it);
      else out.push({authorId:it.authorId, items:[it]});
    });
    return out;
  }

  // "L'altro" e' l'altra persona rispetto a chi possiede la chat: la domanda
  // risulta sempre sua, quindi il punto di vista e' sempre il suo, anche se a
  // premere il pulsante e' stata l'altra.
  function ultimoDellAltro(items){
    var riferimento = S.proprietario || S.uid;
    for(var i=items.length-1;i>=0;i--){
      if(items[i].kind==="human" && items[i].authorId!==riferimento) return items[i];
    }
    return null;
  }

  function nomeDi(msg){
    return msg.nome || (S.profiles[msg.authorId]||{}).name || "l'altra persona";
  }

  function chiediUltimoMessaggio(){
    var tutti=allItems(), msg=ultimoDellAltro(tutti);
    if(!msg){
      showBanner("Ancora nessun messaggio dell'altra persona da commentare: appena scrive, questo pulsante funziona.", false);
      return;
    }
    // Gli do il contesto recente, ma gli chiedo di commentare quel messaggio li'.
    chiediAClaude(ultimi(tutti), function(){
      return "Ti e' stato chiesto con un pulsante "+
             "che cosa pensi dell'ultimo messaggio scritto da "+nomeDi(msg)+", "+
             "quello delle "+hhmm(msg.ts)+" che dice: \u00ab"+(msg.text||"")+"\u00bb.\n"+
             "Commenta quel messaggio: come lo leggi, che cosa ne pensi, e se puo' servire "+
             "che cosa suggeriresti di rispondere. Il resto della trascrizione e' solo contesto.";
    });
  }

  function chiediUltimiScambi(){
    var tutti=allItems(), tutti_scambi=scambi(tutti);
    if(!tutti_scambi.length){
      showBanner("La chat e' ancora vuota: scrivete qualcosa e poi riprova.", false);
      return;
    }
    var ultimiTre = tutti_scambi.slice(-3);
    var da = ultimiTre[0].items[0].ts || 0;
    var finestra = tutti.filter(function(it){ return (it.ts||0) >= da; });
    if(finestra.length > MEMORIA_MSG) finestra = finestra.slice(-MEMORIA_MSG);
    chiediAClaude(finestra, function(){
      var quanti = ultimiTre.length;
      return "Ti e' stato chiesto con un pulsante "+
             "che cosa pensi degli ultimi "+quanti+" scambi della conversazione"+
             (quanti<3 ? " (sono tutti quelli che ci sono finora)" : "")+".\n"+
             "Uno scambio e' tutto quello che una persona ha scritto di fila prima che "+
             "rispondesse l'altra. Sono gli ultimi della trascrizione, a partire dalle "+
             hhmm(da)+".\n"+
             "Di' come sta andando fra loro in questi scambi: che cosa si stanno dicendo "+
             "davvero, se si stanno capendo, e che cosa noti.";
    });
  }

  // Tutta la conversazione che la pagina riesce a tenere sott'occhio.
  function chiediTuttaLaConversazione(){
    var tutti=allItems();
    if(!tutti.length){
      showBanner("La chat e' ancora vuota: scrivete qualcosa e poi riprova.", false);
      return;
    }
    chiediAClaude(ultimi(tutti), function(){
      return "Ti e' stato chiesto con un pulsante che cosa pensi della conversazione "+
             "nel suo insieme, non di un singolo messaggio ne' degli ultimi scambi.\n"+
             "Guarda tutta la trascrizione: come procede fra queste due persone, di che "+
             "cosa parlano davvero, che cosa noti nel modo in cui si parlano.";
    });
  }

  chipUltimo.addEventListener("click", function(){ puliscBanner(); preparaAudio(); chiediUltimoMessaggio(); });
  chipScambi.addEventListener("click", function(){ puliscBanner(); preparaAudio(); chiediUltimiScambi(); });
  chipTutto.addEventListener("click", function(){ puliscBanner(); preparaAudio(); chiediTuttaLaConversazione(); });

  // ---------- invio ----------
  function submit(){
    var text=input.value.trim();
    if(!text || !S.db || !S.uid) return;
    if(S.ospite && !S.mioNome){ chiediNome(); return; }
    puliscBanner();
    preparaAudio();
    input.value=""; autosize();
    var call = wantsClaude(text);
    var msg = {id:uid(), ts:Date.now(), kind:"human", authorId:S.uid, text:text};
    // Chi non ha un profilo leggibile porta il nome dentro al messaggio:
    // e' l'unico modo perche' l'altra persona sappia chi ha scritto.
    if(S.ospite && S.mioNome) msg.nome=S.mioNome;
    persist(msg);
    if(call){
      if(S.sample) askClaude();
      else showBanner("Claude non è disponibile in questa vista, il messaggio resta comunque nella chat.", false);
    }
  }

  function autosize(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,120)+"px"; }

  send.addEventListener("click", submit);
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", function(e){
    if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); submit(); }
  });
  // Mette @claude all'inizio di quello che si sta scrivendo, cosi' si vede
  // comparire nella casella: e' l'unico modo perche' si capisca che ha fatto
  // qualcosa. Se c'e' gia', non lo raddoppia.
  mention.addEventListener("click", function(){
    if(!/@claude/i.test(input.value)){
      input.value = "@claude " + input.value.replace(/^\s+/,"");
    }
    input.focus(); autosize();
    try{ input.setSelectionRange(input.value.length, input.value.length); }catch(e){}
  });

  // ---------- avvio ----------
  function boot(){
    if(!window.claude || !window.claude.use){
      empty.textContent="Questa pagina funziona solo aperta dentro Claude.";
      return;
    }

    Promise.resolve(window.claude.use("user")).then(function(u){
      S.user=u;
      if(!u) return null;
      return u.me();
    }).then(function(me){
      if(me){
        S.uid=me.id; S.myName=me.name||"";
        S.sonoProprietario = !!me.isOwner ||
          (S.user && typeof S.user.isOwner==="function" && S.user.isOwner()===true);
      }
      if(!S.uid){
        // Invitata da fuori: la piattaforma non da' ne' id ne' nome, ma il
        // permesso di scrivere c'e'. Ci si identifica da soli.
        S.ospite=true;
        S.uid=idOspite();
        S.mioNome=nomeOspite();
        if(!S.mioNome) chiediNome();
      }
      aggiornaRigaSotto();
      return window.claude.use("db");
    }).then(function(db){
      S.db=db;
      if(!db){
        empty.textContent="La chat condivisa non è disponibile in questa vista.";
        return;
      }
      input.disabled=false; send.disabled=false; abilitaComandi(true); autosize();

      // Chi possiede la chat lascia scritto il proprio id, una volta sola:
      // cosi' anche l'altro telefono sa a chi intestare le richieste a Claude.
      db.doc("config/proprietario").get().then(function(d){
        var v = d && d.exists ? (d.data()||{}) : {};
        if(v.id){ S.proprietario=v.id; render(); }
        else if(S.sonoProprietario && S.uid){
          S.proprietario=S.uid;
          return db.doc("config/proprietario").set({id:S.uid});
        }
      }).catch(function(){});
      db.collection("messages").orderBy("day","desc").limit(40).onSnapshot(function(snap){
        S.remote=new Map();
        snap.docs.forEach(function(d){ var v=d.data()||{}; S.remote.set(d.id,{day:v.day,authorId:v.authorId,items:v.items||[]}); });
        var conf=Object.create(null);
        S.remote.forEach(function(doc){ (doc.items||[]).forEach(function(x){ conf[x.id]=1; }); });
        S.pending=S.pending.filter(function(x){ return !conf[x.id]; });
        render();
        S.primoCaricamento=false;
      }, function(e){
        showBanner(e.code==="revoked" ? "L'accesso a questa chat è stato revocato." : "Connessione alla chat interrotta: ricarica la pagina.", true);
      });
      render();
      return window.claude.use("sample");
    }).then(function(sm){
      S.sample=sm;
      abilitaComandi(!S.busy);
      aggiornaRigaSotto();
    }).catch(function(){
      showBanner("Inizializzazione non riuscita: ricarica la pagina.", true);
    });
  }

  boot();
})();
</script>
</body>
</html>
