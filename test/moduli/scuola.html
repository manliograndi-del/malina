<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Iscrizione scolastica</title></head>
<body>
<!-- Che compili il genitore o il figlio, il genitore va nella sua sezione e l'alunno nella sua. -->
<form>
  <h3>Dati del genitore</h3>
  <label>Cognome <input name="g_cognome" data-io="Rossi" data-figlio="Rossi"></label>
  <label>Nome <input name="g_nome" data-io="Mario" data-figlio="Mario"></label>
  <label>Codice fiscale <input name="g_cf" data-io="RSSMRA80C12H501E" data-figlio="RSSMRA80C12H501E"></label>
  <h3>Dati dell'alunno</h3>
  <label>Cognome <input name="a_cognome" data-io="Rossi" data-figlio="Rossi"></label>
  <label>Nome <input name="a_nome" data-io="Luca" data-figlio="Luca"></label>
  <label>Codice fiscale <input name="a_cf" data-io="RSSLCU15E20H501Q" data-figlio="RSSLCU15E20H501Q"></label>
  <label>Nato a <input name="a_luogo" data-io="Roma" data-figlio="Roma"></label>
</form>
</body>
</html>
